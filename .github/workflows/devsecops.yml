name: DevSecOps Pipeline

on:
  push:
  pull_request:


env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/juice-shop
  DOCKER_TAG: ${{ github.sha }}

jobs:

  # ------------------------------
  # Stage 1: SAST (Semgrep)
  # ------------------------------
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        continue-on-error: true
        with:
          config: auto
          generateSarif: true
          output: semgrep.sarif

      - name: Upload SAST report
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.sarif

  # ------------------------------
  # Stage 2: Dependency Scan (Trivy)
  # ------------------------------
# Stage 2: Dependency Scan (Trivy)
# ------------------------------
  dependency_scanning:
    name: Dependency Scan (Trivy)
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget
          TRIVY_VERSION="0.45.0"  # конкретная стабильная версия
          for i in {1..5}; do
            wget https://github.com/aquasecurity/trivy/releases/download/v$TRIVY_VERSION/trivy_${TRIVY_VERSION}_Linux-64bit.deb && break
            echo "Повторная попытка через 10 секунд..."
            sleep 10
          done
          sudo dpkg -i trivy_${TRIVY_VERSION}_Linux-64bit.deb

      - name: Run Trivy FS scan 
        run: ls -l 
        run: trivy fs --scanners vuln --format json --output trivy-report.json juice-shop/


      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json


  # ------------------------------
  # Stage 3: Docker Build & Push
  # ------------------------------
  docker_build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: dependency_scanning
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:$DOCKER_TAG .

      - name: Push Docker image
        run: docker push $IMAGE_NAME:$DOCKER_TAG

  # ------------------------------
  # Stage 4: DAST (OWASP ZAP Baseline)
  # ------------------------------
  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: docker_build
    steps:
      - uses: actions/checkout@v4

      - name: Run Juice Shop container
        run: |
          docker run -d -p 3000:3000 --name juice-shop $IMAGE_NAME:$DOCKER_TAG
          sleep 15

      - name: Run ZAP Baseline Scan
        run: |
          docker run \
            --network="host" \
            owasp/zap2docker-stable \
            zap-baseline.py -t http://localhost:3000 -r zap-report.html

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report.html
