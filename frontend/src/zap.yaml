env:
  contexts:
    - name: "default"
      urls:
        - "http://host.docker.internal:3000"

jobs:
  - type: spider
    parameters:
      context: "default"
      maxDuration: 60

  - type: passiveScan-config
    parameters:
      maxDuration: 120

  - type: report
    parameters:
      template: "traditional-html"
      reportFile: "zap-report.html"
      reportDir: "/zap/output"

  - type: report
    parameters:
      template: "traditional-json"
      reportFile: "zap-report.json"
      reportDir: "/zap/output"
