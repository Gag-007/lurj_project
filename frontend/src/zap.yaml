env:
  contexts:
    - name: "app"
      urls:
        - "http://localhost:3000"

jobs:
  - name: spider
    type: spider
    parameters:
      context: "app"
      maxDuration: 1

  - name: passive scan
    type: passiveScan-wait
    parameters:
      maxDuration: 2

  - name: report html
    type: report
    parameters:
      template: "traditional-html"
      reportDir: "/zap/wrk"
      reportFile: "zap-report.html"

  - name: report json
    type: report
    parameters:
      template: "traditional-json"
      reportDir: "/zap/wrk"
      reportFile: "zap-report.json"
